apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetherlake-ingress
  namespace: aetherlake
  annotations:
    kubernetes.io/ingress.class: nginx
    # Self-signed CA managed by cert-manager (see aetherlake-tls.yaml).
    cert-manager.io/cluster-issuer: aetherlake-ca
    # Keep plain HTTP working: the SSO issuer/redirect URLs are still http://
    # and in-cluster OIDC discovery resolves these hosts straight to the
    # backing Services. Forcing a redirect here would break those flows.
    # HTTPS is served in parallel for clients that trust the AetherLake CA.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls:
    - hosts:
        - minio.aetherlake.local
        - polaris.aetherlake.local
        - keycloak.aetherlake.local
        - airflow.aetherlake.local
        - superset.aetherlake.local
        - oauth2.aetherlake.local
      secretName: aetherlake-tls
  rules:
    - host: minio.aetherlake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-console
                port:
                  number: 9090
    - host: polaris.aetherlake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: core-data-stack-polaris
                port:
                  number: 8181
    - host: keycloak.aetherlake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: security-stack-keycloak
                port:
                  number: 80
    - host: airflow.aetherlake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: core-data-stack-webserver
                port:
                  number: 8080
    - host: superset.aetherlake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: core-data-stack-superset
                port:
                  number: 8088
    # oauth2-proxy itself (Keycloak SSO callback endpoint for the gated hosts).
    - host: oauth2.aetherlake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
---
# Web UIs without native OIDC support are gated through oauth2-proxy via nginx
# external auth: anonymous requests are redirected to oauth2.aetherlake.local,
# which runs the Keycloak OIDC flow (see core-data-stack/templates/
# oauth2-proxy.yaml and the oauth2-proxy client in the realm definition).
# Trino itself runs without authentication and trusts the X-Trino-User header,
# so its route must never be reachable anonymously. The Control Panel keeps
# working because it calls Trino through the in-cluster service, not the
# ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetherlake-trino-ingress
  namespace: aetherlake
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: aetherlake-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.aetherlake.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "http://oauth2.aetherlake.local/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email, X-Auth-Request-User"
spec:
  tls:
    - hosts:
        - trino.aetherlake.local
      secretName: aetherlake-trino-tls
  rules:
    - host: trino.aetherlake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: core-data-stack-trino
                port:
                  number: 8080
---
# Milvus Attu has no authentication of its own; same oauth2-proxy gate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetherlake-milvus-ingress
  namespace: aetherlake
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: aetherlake-ca
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.aetherlake.svc.cluster.local:4180/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "http://oauth2.aetherlake.local/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Email, X-Auth-Request-User"
spec:
  tls:
    - hosts:
        - milvus.aetherlake.local
      secretName: aetherlake-milvus-tls
  rules:
    - host: milvus.aetherlake.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: core-data-stack-milvus-attu
                port:
                  number: 3000
