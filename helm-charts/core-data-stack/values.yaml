global:
  # The Control Panel will dynamically provision this Secret and update it via the Kubernetes API
  existingSecret: "open-lake-credentials"
  s3:
    endpoint: "http://minio-hl:9000"
    defaultBucket: "lakehouse"

# Optional demo dataset (iceberg.demo.events / iceberg.demo.users) seeded after
# install via a post-install hook so a fresh cluster has data to explore in the
# SQL IDE and the Iceberg Tables page. Idempotent; safe to leave on.
demoData:
  enabled: true
  image: "python:3.12-slim"

# 1. MinIO AIStor Configuration (Storage Layer — deployed via Operator Tenant CRD)
minio:
  enabled: true
  # Official MinIO image with full OIDC Console support
  image: "quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z"
  # Standalone dev mode
  servers: 1
  volumesPerServer: 1
  storageSize: "20Gi"
  storageClassName: "hostpath"
  # Root credentials written to the config.env secret. These are overridden at
  # install time (install.sh --set minio.rootUser/rootPassword=...) with the same
  # randomized values stored in the credentials secret under minio-root-user /
  # minio-root-password, so Trino, Milvus and Polaris authenticate successfully.
  # The values below are dev placeholders only.
  rootUser: "minioadmin"
  rootPassword: "CHANGE_ME"
  # Buckets to create on initialization
  initBuckets:
    - "lakehouse"
    - "milvus-vectors"
  # Keycloak OIDC SSO Config
  oidc:
    configUrl: "http://keycloak.aetherlake.local/realms/aetherlake/.well-known/openid-configuration"
    clientId: "minio"
    # Overridden at install time (install.sh --set minio.oidc.clientSecret=...) so
    # it matches the randomized secret of the `minio` Keycloak client. The default
    # below is a dev placeholder only.
    clientSecret: "CHANGE_ME"
    claimName: "policy"
    scopes: "openid,profile,email"
    keycloakRealm: "aetherlake"
    keycloakAdminUrl: "http://security-stack-keycloak/"

# 2. Apache Polaris Custom Chart (Iceberg REST Catalog)
polaris:
  enabled: true
  replicaCount: 1
  initCatalog:
    enabled: true
    name: "lakehouse_catalog"
    s3Endpoint: "http://minio-hl:9000"
    s3Bucket: "lakehouse"

# 3. Trino Configuration (SQL Engine)
trino:
  enabled: true
  server:
    workers: 2
    config:
      # Real per-user authentication (no more trusted X-Trino-User header):
      # PASSWORD — file authenticator for service users (superset, mcp,
      # control-panel-svc) and the Control Panel dev-credentials login.
      # JWT — Keycloak access tokens forwarded by the Control Panel for
      # interactive users; Trino validates them itself and derives the
      # principal from preferred_username.
      authenticationType: "PASSWORD,JWT"
  # Trino sits behind the nginx ingress, which injects X-Forwarded-* headers. By
  # default airlift's HTTP server rejects forwarded requests with HTTP 406
  # ("Server configuration does not allow processing of the X-Forwarded-For
  # header"), breaking both the Trino web UI and the Control Panel SQL IDE that
  # call /v1/statement through trino.aetherlake.local. Allow processing them.
  additionalConfigProperties:
    - http-server.process-forwarded=true
    # Trino's Web UI defaults to a username login form (login.html). Humans
    # are already authenticated by Keycloak at the ingress (oauth2-proxy), so
    # run the UI with the fixed service user instead of a second login. The
    # fixed user is intentionally read-only (data-scientist group).
    - web-ui.authentication.type=fixed
    - web-ui.user=aetherlake-ui
    # JWT verification against the aetherlake realm. Keycloak's JWKS endpoint
    # is http:// only, and Trino fetches JWKS exclusively over https — so
    # install.sh pulls the realm's active RSA public key into the
    # trino-jwt-key ConfigMap (mounted below) instead. Re-run install.sh after
    # rotating realm keys. principal-field maps the Trino user to the
    # Keycloak username (the default `sub` claim is an opaque UUID).
    - http-server.authentication.jwt.key-file=/etc/trino/auth/jwt/key.pem
    - http-server.authentication.jwt.principal-field=preferred_username
    - http-server.authentication.jwt.required-issuer=http://keycloak.aetherlake.local/realms/aetherlake
  configMounts:
    - name: trino-jwt-key
      configMap: trino-jwt-key
      path: /etc/trino/auth/jwt/key.pem
      subPath: key.pem
  # File-based system access control. Groups mirror the Keycloak realm roles;
  # membership (group.db) and the password file (password.db) contain
  # credential material and are injected by install.sh via trino.auth.*,
  # never committed here. Rules: admins get everything; engineers get
  # read-write on data catalogs (schema ownership on iceberg, so CREATE/DROP
  # work) but not the system catalog; scientists and service accounts are
  # read-only. SHOW CATALOGS/SHOW TABLES are filtered by these rules
  # automatically. Add a per-user rule above the group rules to carve out
  # exceptions.
  accessControl:
    type: configmap
    refreshPeriod: 10s
    configFile: rules.json
    rules:
      rules.json: |-
        {
          "catalogs": [
            { "group": "data-admin", "allow": "all" },
            { "group": "data-engineer", "catalog": "system", "allow": "none" },
            { "group": "data-engineer", "allow": "all" },
            { "group": "data-scientist", "catalog": "system", "allow": "none" },
            { "group": "data-scientist", "allow": "read-only" },
            { "allow": "none" }
          ],
          "schemas": [
            { "group": "data-admin", "owner": true },
            { "group": "data-engineer", "catalog": "iceberg", "owner": true },
            { "owner": false }
          ],
          "queries": [
            { "group": "data-admin", "allow": ["execute", "view", "kill"] },
            { "group": "data-engineer", "allow": ["execute", "view"] },
            { "allow": ["execute"] }
          ]
        }
  env:
    # Inject S3 credentials securely into the Trino pods
    - name: MINIO_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: open-lake-credentials
          key: minio-root-user
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: open-lake-credentials
          key: minio-root-password
    # Polaris OAuth2 client credential (id:secret), injected from the secret and
    # referenced below via ${ENV:...} so it is not hardcoded in the catalog file.
    - name: POLARIS_CREDENTIAL
      valueFrom:
        secretKeyRef:
          name: open-lake-credentials
          key: polaris-credential
  additionalCatalogs:
    # Kafka connector: exposes Kafka topics as SQL tables so data streamed by
    # Flink SQL jobs (e.g. the datagen -> 'events' pipeline) is queryable from
    # Trino and the Control Panel SQL IDE. Table schemas come from the JSON
    # description files mounted from trino.kafka.tableDescriptions below.
    kafka: |-
      connector.name=kafka
      kafka.nodes=aetherlake-kafka-bootstrap:9092
      kafka.default-schema=aetherlake
      kafka.table-description-supplier=FILE
      kafka.table-description-dir=/etc/trino/schemas
      # The FILE supplier only loads descriptions for tables listed here
      # (schema.table). Keep in sync with trino.kafka.tableDescriptions below.
      kafka.table-names=aetherlake.events
      kafka.hide-internal-columns=false
    iceberg: |-
      connector.name=iceberg
      iceberg.catalog.type=rest
      iceberg.rest-catalog.uri=http://core-data-stack-polaris:8181/api/catalog
      iceberg.rest-catalog.warehouse=lakehouse_catalog
      iceberg.rest-catalog.security=OAUTH2
      iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CREDENTIAL}
      # Polaris requires the OAuth2 scope PRINCIPAL_ROLE:ALL. Supported since the
      # Trino chart was bumped to ship Trino >= 458 (see Chart.yaml: trino 1.42.2).
      iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
      # Use the short-lived, per-table credentials Polaris vends (subscoping)
      # instead of the static keys below. Polaris assumes a MinIO STS role scoped
      # to the table prefix; see the Polaris chart (roleArn + minio-polaris user).
      iceberg.rest-catalog.vended-credentials-enabled=true
      fs.native-s3.enabled=true
      s3.endpoint=http://minio-hl:9000
      s3.region=us-east-1
      # Static keys kept as a fallback for non-vended catalog operations.
      s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
      s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
      s3.path-style-access=true
  # Kafka table descriptions (mounted at kafka.mountPath=/etc/trino/schemas by
  # the trino subchart). One JSON file per topic; add an entry here whenever a
  # new topic should be queryable through Trino. Column types follow the JSON
  # written by Flink SQL kafka sinks ('format' = 'json').
  kafka:
    tableDescriptions:
      # Schema of pipelines/flink/examples/datagen-to-kafka.sql. event_ts is
      # VARCHAR because the kafka connector only parses ISO-8601 timestamps
      # while Flink's json format emits SQL format ("2026-08-05 16:42:26.739");
      # use parse_datetime(event_ts, 'yyyy-MM-dd HH:mm:ss.SSS') to convert.
      events.json: |-
        {
          "tableName": "events",
          "schemaName": "aetherlake",
          "topicName": "events",
          "message": {
            "dataFormat": "json",
            "fields": [
              { "name": "event_id", "mapping": "event_id", "type": "VARCHAR" },
              { "name": "user_id", "mapping": "user_id", "type": "VARCHAR" },
              { "name": "event_type", "mapping": "event_type", "type": "VARCHAR" },
              { "name": "event_ts", "mapping": "event_ts", "type": "VARCHAR" }
            ]
          }
        }

# Keycloak SSO gate for web UIs without native OIDC support (Trino UI, Milvus
# Attu). An oauth2-proxy deployment sits behind nginx external-auth: anonymous
# browser requests are redirected through the Keycloak OIDC flow and the
# session cookie is shared across *.aetherlake.local. Apps with native OIDC
# (Superset, Airflow, MinIO) keep their own flows and are not double-gated.
sso:
  enabled: true
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1

# 4. Apache Spark Operator (Processing Engine)
spark-operator:
  enabled: true
  sparkJobNamespace: "default"

# 5. Apache Airflow (Orchestrator) — official Apache chart, apache/airflow images.
airflow:
  enabled: true
  # Maintained upstream image (Airflow 2.10.5, last 2.x for FAB SSO).
  defaultAirflowRepository: apache/airflow
  defaultAirflowTag: "2.10.5"
  # LocalExecutor: the scheduler runs tasks in-process, so no Celery workers and
  # no Redis broker are needed — one less stateful dependency for a dev cluster.
  executor: LocalExecutor
  # Use the shared, upstream-maintained datastores instead of the chart's bundled
  # Bitnami postgresql/redis subcharts.
  postgresql:
    enabled: false
  redis:
    enabled: false
  # Metadata DB connection, Fernet key and Flask secret key all come from the
  # airflow-official secret created by install.sh (keys: connection / fernet-key
  # / webserver-secret-key).
  data:
    metadataSecretName: airflow-official
  fernetKeySecretName: airflow-official
  webserverSecretKeySecretName: airflow-official
  # Run the DB migration and admin-user jobs as normal resources, NOT Helm hooks.
  # As post-install hooks they share the release's hook chain, which Helm aborts
  # on the first failure — so a slow/failing Superset init hook would silently
  # skip the Airflow migration, leaving scheduler/webserver stuck forever in
  # "Waiting for migrations". Decoupling them makes the migration run regardless.
  migrateDatabaseJob:
    useHelmHooks: false
  createUserJob:
    useHelmHooks: false
  # No Celery components with LocalExecutor.
  workers:
    replicas: 0
  flower:
    enabled: false
  # Don't load Airflow's example DAGs.
  env:
    - name: AIRFLOW__CORE__LOAD_EXAMPLES
      value: "False"
    - name: KEYCLOAK_BASE_URL
      value: "http://keycloak.aetherlake.local"
  # Keycloak OIDC client secret for the webserver_config.py, from the secret.
  extraEnv: |
    - name: AIRFLOW_OIDC_SECRET
      valueFrom:
        secretKeyRef:
          name: aetherlake-credentials
          key: airflow-oidc-secret
  webserver:
    # Keycloak OIDC SSO via Flask AppBuilder. Reuses the webserver_config.py
    # ConfigMap (templates/airflow-webserver-config.yaml), which maps realm roles
    # to Airflow roles for the `airflow` Keycloak client.
    webserverConfigConfigMapName: airflow-webserver-config

# 6. Milvus (Vector Database)
milvus:
  enabled: true
  cluster:
    enabled: false # Use standalone for local cluster to save resources
  standalone:
    enabled: true
    # Embedded RocksMQ message queue — keeps the WAL on the local PVC, no broker.
    messageQueue: rocksmq
    # Kubernetes auto-injects service-link env vars for the `minio` Service,
    # including MINIO_PORT=tcp://<minio-svc-ip>:80. Milvus reads MINIO_PORT as the
    # override for minio.port, so that value silently corrupts the S3 endpoint and
    # the 2.6 streaming node crash-loops with "Endpoint url cannot have fully
    # qualified paths". Setting the MinIO connection explicitly here makes the
    # pod-spec env win over the auto-injected service links. Credentials use
    # Milvus's native env override (the externalS3 ${ENV:...} values do not
    # resolve, so they are superseded by these).
    extraEnv:
      - name: MINIO_ADDRESS
        value: "minio-hl"
      - name: MINIO_PORT
        value: "9000"
      - name: MINIO_ACCESSKEYID
        valueFrom:
          secretKeyRef:
            name: open-lake-credentials
            key: minio-root-user
      - name: MINIO_SECRETACCESSKEY
        valueFrom:
          secretKeyRef:
            name: open-lake-credentials
            key: minio-root-password
  # No external broker needed with RocksMQ.
  pulsarv3:
    enabled: false
  pulsar:
    enabled: false

  # Attu web UI. The `milvus.aetherlake.local` ingress route targets the
  # core-data-stack-milvus-attu service this creates.
  attu:
    enabled: true

  # Disable embedded MinIO to prevent Bitnami common template clashes
  # Instead, point it to the primary MinIO instance we deployed in step 1
  minio:
    enabled: false
  
  externalS3:
    enabled: true
    host: "minio-hl"
    port: 9000
    bucketName: "milvus-vectors"
    # Inject AWS credentials securely
    accessKey: "${ENV:MINIO_ACCESS_KEY}"
    secretKey: "${ENV:MINIO_SECRET_KEY}"

# 7. Apache Superset Configuration
superset:
  enabled: true

  # Use the shared, upstream-maintained PostgreSQL and Redis (templates/
  # shared-datastores.yaml) instead of the retired Bitnami subchart images.
  postgresql:
    enabled: false
  redis:
    enabled: false
  supersetNode:
    connections:
      db_host: aetherlake-postgres
      db_port: "5432"
      db_user: superset
      db_name: superset
      # Placeholder; the real password is injected via extraEnvRaw (DB_PASS)
      # below from the open-lake-credentials secret and overrides this.
      db_pass: overridden-by-secret
      redis_host: aetherlake-redis
      redis_port: "6379"
      # Non-empty so the chart wires Redis auth; real value comes from
      # extraEnvRaw (REDIS_PASSWORD) below.
      redis_password: overridden-by-secret

  # Inject Keycloak OIDC client secret and the real DB/Redis passwords from the
  # unified secret. These env entries override the placeholders the chart bakes
  # into its env secret (env list takes precedence over envFrom).
  extraEnvRaw:
    - name: SUPERSET_OIDC_SECRET
      valueFrom:
        secretKeyRef:
          name: open-lake-credentials
          key: superset-oidc-secret
    # Flask/Superset SECRET_KEY (session signing + encryption of stored DB
    # credentials). Generated by install.sh; never hardcoded in this file.
    - name: SUPERSET_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: open-lake-credentials
          key: superset-secret-key
    # Bootstrap admin password for the init job's `fab create-admin`.
    - name: SUPERSET_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: open-lake-credentials
          key: superset-admin-password
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: open-lake-credentials
          key: postgres-password
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: open-lake-credentials
          key: redis-password

  # Custom initialization: run the standard Superset bootstrap (DB migrate,
  # admin user, init) then auto-import the Trino datasource. The previous script
  # called a non-existent `superset-init` command, which failed the init job.
  init:
    initscript: |-
      #!/bin/sh
      set -e
      superset db upgrade
      superset fab create-admin \
        --username admin --firstname Admin --lastname User \
        --email admin@superset.com \
        --password "${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD must be set (superset-admin-password key in open-lake-credentials)}" || true
      superset init
      if [ -f /app/configs/import_datasources.yaml ]; then
        superset import_datasources -p /app/configs/import_datasources.yaml || true
      fi

  # Auto-provision Trino database connection on startup. Trino now requires
  # authentication, so the URI must carry the `superset` service-user
  # password — install.sh overrides this file with the real credential
  # (trino-superset-password key). The URI below is only a shape reference
  # for bare `helm install` runs.
  extraConfigs:
    import_datasources.yaml: |
      databases:
        - database_name: "Trino Analytics"
          sqlalchemy_uri: "trino://superset@core-data-stack-trino:8080/iceberg"
          expose_in_sqllab: true
          allow_run_async: true

  # Install required drivers at runtime. Pin cryptography to Superset 3.1.2's
  # supported range: Authlib otherwise pulls the latest cryptography (49.x),
  # which violates Superset's strict pin (>=42.0.4,<43.0.0) and makes every
  # Superset process (incl. the init-db job) crash on startup with
  # "DistributionNotFound: cryptography".
  bootstrapScript: |
    #!/bin/bash
    PIP_PKGS="sqlalchemy-trino Authlib PyJWT cryptography>=42.0.4,<43.0.0"
    if [ -f /app/.venv/bin/pip ]; then
      /app/.venv/bin/pip install $PIP_PKGS
    else
      pip install $PIP_PKGS
    fi

  # Configuration overrides for Keycloak OIDC SSO Integration
  configOverrides:
    custom_sso: |
      import os
      from flask_appbuilder.security.manager import AUTH_OAUTH
      # Superset 3.x requires a custom security manager to extend Superset's own
      # SupersetSecurityManager, not FAB's SecurityManager (see UPDATING.md [4565]).
      from superset.security import SupersetSecurityManager
      import jwt

      # Session-signing / credential-encryption key. Injected from the
      # open-lake-credentials secret (key: superset-secret-key) — a key
      # committed to the repo would let anyone forge Superset sessions.
      SECRET_KEY = os.environ.get("SUPERSET_SECRET_KEY")
      if not SECRET_KEY:
          raise RuntimeError("SUPERSET_SECRET_KEY env var must be set (see install.sh)")
      AUTH_TYPE = AUTH_OAUTH
      AUTH_USER_REGISTRATION = True
      AUTH_USER_REGISTRATION_ROLE = "Public"

      OAUTH_PROVIDERS = [
          {
              "name": "keycloak",
              "token_key": "access_token",
              "icon": "fa-key",
              "remote_app": {
                  "client_id": "superset",
                  "client_secret": os.environ.get("SUPERSET_OIDC_SECRET"),
                  "server_metadata_url": "http://security-stack-keycloak:80/realms/aetherlake/.well-known/openid-configuration",
                  "client_kwargs": {
                      "scope": "openid profile email"
                  }
              }
          }
      ]

      class CustomSsoSecurityManager(SupersetSecurityManager):
          def oauth_user_info(self, provider, response=None):
              if provider == 'keycloak':
                  token = response.get('access_token')
                  try:
                      decoded = jwt.decode(token, options={"verify_signature": False})
                      realm_roles = decoded.get('realm_access', {}).get('roles', [])
                  except Exception:
                      realm_roles = []
                  
                  me = self.appbuilder.sm.oauth_remotes[provider].get('userinfo').json()
                  
                  mapped_roles = ['Gamma']
                  if 'data-admin' in realm_roles:
                      mapped_roles = ['Admin']
                  elif 'data-engineer' in realm_roles or 'data-scientist' in realm_roles:
                      mapped_roles = ['Alpha']
                  
                  return {
                      'username': me.get('preferred_username', me.get('sub')),
                      'first_name': me.get('given_name', ''),
                      'last_name': me.get('family_name', ''),
                      'email': me.get('email', ''),
                      'role_keys': mapped_roles
                  }
              return {}

          def auth_user_oauth(self, userinfo, provider, response=None):
              user = super().auth_user_oauth(userinfo, provider, response)
              if user and provider == 'keycloak':
                  role_keys = userinfo.get('role_keys', ['Gamma'])
                  user.roles = []
                  for role_name in role_keys:
                      role = self.find_role(role_name)
                      if role:
                          user.roles.append(role)
                  self.get_session.commit()
              return user

      CUSTOM_SECURITY_MANAGER = CustomSsoSecurityManager

# 8. Apache Kafka (Streaming Platform) — Strimzi operator + KRaft cluster
# Deployed via the strimzi-kafka-operator dependency (Chart.yaml) plus the
# KafkaNodePool / Kafka / KafkaTopic custom resources in
# templates/kafka-cluster.yaml. Single dual-role node for local clusters.
kafka:
  enabled: true
  cluster:
    # Kafka custom resource name. Also the DNS prefix of the broker services:
    # <name>-kafka-bootstrap:9092 is the in-cluster bootstrap address that
    # Flink SQL jobs use (see pipelines/flink/examples/*.sql).
    name: "aetherlake"
    # Kafka version supported by the pinned Strimzi operator (4.2.0 - 4.3.0).
    version: "4.3.0"
    metadataVersion: "4.3-IV0"
    replicas: 1
    storageSize: "10Gi"
    # Empty uses the cluster default StorageClass (hostpath on Docker Desktop).
    storageClassName: ""
    # Single-broker dev defaults: every topic must fit on one node. Raise
    # these together with replicas for multi-node clusters.
    replicationFactor: 1
    minInSyncReplicas: 1
  # Authenticated access for clients outside the cluster: a TLS + SCRAM-SHA-512
  # nodeport listener (authentication only — Strimzi ACLs are cluster-wide and
  # intentionally not used here), plus a KafkaUser holding the credentials
  # (secret <username>, keys sasl.jaas.config / password).
  external:
    enabled: true
    username: "external-producer"
  # Topics reconciled by the Strimzi topic operator. `events` backs the
  # pipelines/flink example jobs.
  topics:
    - name: "events"
      partitions: 3
      replicas: 1

# 9. Apache Flink (Stream Processing) — Flink Kubernetes Operator
# The operator dependency (Chart.yaml) watches FlinkDeployment custom
# resources. The Control Panel creates one FlinkDeployment per submitted Flink
# SQL job (application mode, dedicated mini-cluster per job) through the
# Kubernetes API; nothing Flink-job-specific is templated by this chart.
flink:
  enabled: true
  # Image used for SQL jobs. Built by install.sh from
  # pipelines/flink/sql-runner (vendored Apache flink-sql-runner-example on a
  # flink:2.1 base, Kafka SQL connector shaded in). The Control Panel reads the
  # same value via the FLINK_SQL_RUNNER_IMAGE env var; keep both in sync.
  sqlRunner:
    image: "aetherlake/flink-sql-runner:flink-2.1"
  # Per-job mini-cluster sizing (FlinkDeployment defaults applied by the
  # Control Panel when submitting SQL jobs).
  jobs:
    flinkVersion: "v2_1"
    jobManagerMemory: "1024m"
    taskManagerMemory: "2048m"

# Flink operator subchart values. The upstream chart ships snapshot image tags
# by default; pin the released Docker Hub image instead. The webhook needs
# cert-manager (installed by install.sh before this chart).
flink-kubernetes-operator:
  image:
    repository: apache/flink-kubernetes-operator
    tag: "1.15.0"
