{{- if .Values.sso.enabled }}
# oauth2-proxy: Keycloak SSO gate for web UIs that have no native OIDC
# support (Trino UI, Milvus Attu). nginx external-auth annotations on the
# protected ingresses (see aetherlake-ingress.yaml) forward anonymous browser
# requests here; the proxy runs the OIDC flow against Keycloak and sets a
# session cookie for *.aetherlake.local. Apps with native OIDC (Superset,
# Airflow, MinIO console) keep their own flows and bypass this proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: oauth2-proxy
    app.kubernetes.io/part-of: aetherlake
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
        app.kubernetes.io/part-of: aetherlake
    spec:
      containers:
        - name: oauth2-proxy
          image: {{ .Values.sso.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4180
          env:
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: "0.0.0.0:4180"
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            # Resolves inside the cluster through the CoreDNS rewrite
            # install.sh adds for keycloak.aetherlake.local.
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: http://keycloak.aetherlake.local/realms/aetherlake
            - name: OAUTH2_PROXY_CLIENT_ID
              value: oauth2-proxy
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aetherlake-credentials
                  key: oauth2-proxy-oidc-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: aetherlake-credentials
                  key: oauth2-proxy-cookie-secret
            # Slice options take the plural env var name in oauth2-proxy
            # (email-domain -> OAUTH2_PROXY_EMAIL_DOMAINS).
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            # One session cookie shared by every protected host.
            - name: OAUTH2_PROXY_COOKIE_DOMAIN
              value: .aetherlake.local
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: .aetherlake.local
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: http://oauth2.aetherlake.local/oauth2/callback
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            # The platform serves plain HTTP (self-signed CA in parallel).
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "false"
            - name: OAUTH2_PROXY_COOKIE_SAMESITE
              value: lax
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            # Keycloak accounts created by keycloak-config-cli carry no
            # verified-email flag; rejecting them would lock every user out.
            - name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: "true"
            - name: OAUTH2_PROXY_SCOPE
              value: "openid email profile"
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: oauth2-proxy
    app.kubernetes.io/part-of: aetherlake
spec:
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
{{- end }}
