apiVersion: v2
name: core-data-stack
description: Modular Data Lakehouse Umbrella Chart (MinIO, Trino, Spark, Polaris)
type: application
version: 0.1.0

dependencies:
  # MinIO is now deployed via MinIO Operator Tenant CRD (see templates/minio-tenant.yaml)
  # - name: minio (removed — replaced by AIStor Tenant CRD)
  - name: trino
    version: 1.42.2
    repository: https://trinodb.github.io/charts
    condition: trino.enabled
  - name: spark-operator
    version: 1.1.27
    repository: https://kubeflow.github.io/spark-operator
    condition: spark-operator.enabled
  # Local subchart for Apache Polaris
  - name: polaris
    version: 0.1.0
    repository: "file://./charts/polaris"
    condition: polaris.enabled
  # Official Apache Airflow chart (apache/airflow images, upstream-maintained).
  # Pinned to the last 2.x app version (2.10.5) so the Flask AppBuilder
  # webserver_config.py SSO integration keeps working.
  - name: airflow
    version: 1.16.0
    repository: https://airflow.apache.org
    condition: airflow.enabled
  - name: milvus
    version: 5.0.14
    repository: https://zilliztech.github.io/milvus-helm/
    condition: milvus.enabled
  - name: superset
    version: 0.12.8
    repository: https://apache.github.io/superset
    condition: superset.enabled
  # Strimzi cluster operator for Apache Kafka (KRaft mode). The operator manages
  # the Kafka / KafkaNodePool / KafkaTopic custom resources shipped in
  # templates/kafka-cluster.yaml. Pinned to 1.1.0, which supports Kafka
  # 4.2.0 - 4.3.0.
  - name: strimzi-kafka-operator
    version: 1.1.0
    repository: https://strimzi.io/charts/
    condition: kafka.enabled
  # Apache Flink Kubernetes Operator. Manages the FlinkDeployment custom
  # resources that the Control Panel creates when users submit Flink SQL jobs
  # (application mode, one dedicated mini-cluster per job). The chart installs
  # its CRDs and needs cert-manager for its admission webhook certificates, so
  # install.sh provisions cert-manager before the core data stack.
  - name: flink-kubernetes-operator
    version: 1.15.0
    repository: https://downloads.apache.org/flink/flink-kubernetes-operator-1.15.0/
    condition: flink.enabled

