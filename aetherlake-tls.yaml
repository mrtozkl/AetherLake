# Self-signed CA chain for *.aetherlake.local, managed by cert-manager.
# Applied by install.sh after cert-manager is installed. The ingress resources
# reference the `aetherlake-ca` ClusterIssuer, which signs per-ingress
# certificates from the root below.
#
# To trust the CA on your machine (removes browser warnings):
#   kubectl get secret aetherlake-root-ca -n cert-manager \
#     -o jsonpath='{.data.ca\.crt}' | base64 -d > aetherlake-ca.crt
#   # macOS: security add-trusted-cert -d -r trustRoot \
#   #   -k ~/Library/Keychains/login.keychain-db aetherlake-ca.crt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aetherlake-selfsigned
spec:
  selfSigned: {}
---
# Root CA certificate. Lives in the cert-manager namespace so the ClusterIssuer
# below can read its secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aetherlake-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: AetherLake Local CA
  secretName: aetherlake-root-ca
  duration: 87600h # 10 years — local dev CA
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: aetherlake-selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: aetherlake-ca
spec:
  ca:
    secretName: aetherlake-root-ca
---
# Service certificate for the Trino coordinator's HTTPS listener (port 8443).
# cert-manager also renders a PKCS12 keystore (keystore.p12) into the same
# secret — airlift's HTTPS server needs a keystore, not raw PEM. The keystore
# password lives in aetherlake-credentials (trino-keystore-password), created
# by install.sh before this file is applied. localhost/127.0.0.1 are covered
# so `kubectl port-forward` to the HTTPS port verifies cleanly from a dev
# machine (with NODE_EXTRA_CA_CERTS pointing at the root CA).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trino-tls
  namespace: aetherlake
spec:
  secretName: trino-tls
  commonName: core-data-stack-trino
  dnsNames:
    - core-data-stack-trino
    - core-data-stack-trino.aetherlake
    - core-data-stack-trino.aetherlake.svc
    - core-data-stack-trino.aetherlake.svc.cluster.local
    - trino.aetherlake.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  duration: 2160h # 90 days
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: aetherlake-credentials
        key: trino-keystore-password
  issuerRef:
    name: aetherlake-ca
    kind: ClusterIssuer
    group: cert-manager.io
